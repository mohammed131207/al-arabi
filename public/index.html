<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF6E6">
  <title>منيو مطعم العربي</title>
  <link rel="icon" href="/img/mark.png">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/menu.css">
</head>
<body class="menu-page">
  <header class="m-top">
    <button class="m-back" id="backBtn" type="button" aria-label="رجوع" hidden></button>
    <div class="m-brand">
      <img class="m-mark" src="/img/mark.png" alt="">
      <h1 id="shopName">مطعم العربي</h1>
    </div>
    <button class="m-table" id="tableBtn" type="button" hidden></button>
  </header>

  <main id="view"></main>

  <footer class="m-foot">
    <img src="/img/logo.png" alt="مطعم العربي">
  </footer>

  <button class="m-cart" id="cartBar" type="button" hidden></button>

  <!-- تفاصيل الصنف -->
  <dialog class="m-sheet" id="itemDlg" aria-label="تفاصيل الصنف"></dialog>

  <!-- السلة -->
  <dialog class="dlg m-cartdlg" id="cartDlg" aria-labelledby="cartTitle">
    <div class="dlg-head"><h2 id="cartTitle">طلبك</h2><button class="icon-btn" type="button" data-close aria-label="إغلاق"></button></div>
    <div class="dlg-body" id="cartBody"></div>
    <div class="dlg-foot" id="cartFoot"></div>
  </dialog>

  <!-- الطاولة مشغولة -->
  <section class="m-gate" id="busy" hidden>
    <img src="/img/logo.png" alt="مطعم العربي">
    <h2>طاولة <span class="num" id="busyNo"></span> مشغولة</h2>
    <p class="muted">في زباين قاعدين عليها هلأ وعندهم طلب.</p>
    <button class="btn btn-brand btn-lg" type="button" id="busyJoin">أنا قاعد معهم، كمّل</button>
    <button class="btn btn-ghost" type="button" id="busyOther">بدي طاولة تانية</button>
  </section>

  <!-- رقم الطاولة -->
  <section class="m-gate" id="gate" hidden>
    <img src="/img/logo.png" alt="مطعم العربي">
    <h2>أهلاً فيك، شو رقم طاولتك؟</h2>
    <p class="muted">الرقم مكتوب على الكرت اللي على الطاولة</p>
    <form id="gateForm" class="row" style="justify-content:center">
      <input class="input num" id="gateInput" inputmode="numeric" maxlength="3" autocomplete="off" aria-label="رقم الطاولة" style="width:120px;text-align:center;font-size:22px;font-weight:700">
      <button class="btn btn-brand btn-lg" type="submit">يلا</button>
    </form>
    <p class="dlg-err" id="gateErr" role="alert"></p>
    <button class="btn btn-ghost" type="button" id="justLook">بدي أتفرج عالمنيو بس</button>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/menu.js"></script>
</body>
</html>
