# إعدادات Render: سيرفر Node مجاني بفرانكفورت (الأقرب لفلسطين)، والبيانات بقاعدة Turso
services:
  - type: web
    name: al-arabi
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      # توقيت المطعم: التواريخ والتقارير ويوم الخميس (الضاني) على توقيت فلسطين
      - key: TZ
        value: Asia/Gaza
      # صاحي بس من 9 الصبح لـ 2 بالليل، عشان ما يخلّص ساعات Render المجانية على باقي الخدمات
      - key: KEEP_AWAKE_HOURS
        value: "9-2"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
