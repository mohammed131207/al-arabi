# إعدادات Render: سيرفر Node مجاني بفرانكفورت (الأقرب لفلسطين)، والبيانات بقاعدة Turso
services:
  - type: web
    name: al-arabi
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
